name: Build images

on:
  schedule:
    # Look for a new upstream release every morning.
    - cron: "17 4 * * *"
    # Rebuild the current release weekly, so that fixes to the Alpine base
    # image reach the published images without waiting for an frp release.
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      frp_version:
        description: "frp release tag to build, e.g. v0.71.0 (default: the latest upstream release)"
        required: false
        type: string
      force:
        description: "Build even if this version is already published"
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - "server/Dockerfile"
      - "client/Dockerfile"
      - "hack/smoke-test.sh"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7

# Never publish two versions concurrently, but let a running build finish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      latest: ${{ steps.version.outputs.latest }}
      frps_image: ${{ steps.version.outputs.frps_image }}
      frpc_image: ${{ steps.version.outputs.frpc_image }}
      build: ${{ steps.published.outputs.build }}
    steps:
      - name: Resolve the frp release to build
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.frp_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [ -n "${REQUESTED}" ]; then
            tag="${REQUESTED}"
            # An explicitly requested version is not necessarily the newest one,
            # so it must not take over the "latest" tag.
            latest=false
          else
            tag="$(gh api repos/fatedier/frp/releases/latest --jq .tag_name)"
            latest=true
          fi

          case "${tag}" in
            v*) ;;
            *) tag="v${tag}" ;;
          esac
          version="${tag#v}"

          case "${version}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'${tag}' does not look like an frp release tag" && exit 1 ;;
          esac

          owner="$(echo "${OWNER}" | tr '[:upper:]' '[:lower:]')"

          {
            echo "tag=${tag}"
            echo "version=${version}"
            echo "minor=${version%.*}"
            echo "latest=${latest}"
            echo "frps_image=${REGISTRY}/${owner}/frps"
            echo "frpc_image=${REGISTRY}/${owner}/frpc"
          } >>"${GITHUB_OUTPUT}"

          echo "Resolved frp ${tag} (latest=${latest})" >>"${GITHUB_STEP_SUMMARY}"

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Decide whether anything needs building
        id: published
        env:
          FORCE: ${{ inputs.force || github.event_name == 'push' || github.event.schedule == '17 5 * * 1' }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGES: ${{ steps.version.outputs.frps_image }} ${{ steps.version.outputs.frpc_image }}
        run: |
          set -euo pipefail

          if [ "${FORCE}" = "true" ]; then
            echo "Rebuild was requested explicitly."
            echo "build=true" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          build=false
          for image in ${IMAGES}; do
            if docker buildx imagetools inspect "${image}:${VERSION}" >/dev/null 2>&1; then
              echo "${image}:${VERSION} is already published."
            else
              echo "${image}:${VERSION} is missing."
              build=true
            fi
          done
          echo "build=${build}" >>"${GITHUB_OUTPUT}"

  build:
    name: Build and publish frp ${{ needs.resolve.outputs.tag }}
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Collect frps metadata
        id: meta-frps
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.resolve.outputs.frps_image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=${{ needs.resolve.outputs.minor }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.latest }}
          labels: |
            org.opencontainers.image.title=frps
            org.opencontainers.image.description=frp server (frps), built from source
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Collect frpc metadata
        id: meta-frpc
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.resolve.outputs.frpc_image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}
            type=raw,value=${{ needs.resolve.outputs.minor }}
            type=raw,value=latest,enable=${{ needs.resolve.outputs.latest }}
          labels: |
            org.opencontainers.image.title=frpc
            org.opencontainers.image.description=frp client (frpc), built from source
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0

      # Built for the runner's architecture only and kept local, so that the
      # smoke test runs before anything is published. The buildx builder stays
      # up for the whole job, so the multi-arch build below reuses these layers.
      - name: Build frps for testing
        uses: docker/build-push-action@v6
        with:
          context: server
          load: true
          tags: frps:test
          build-args: FRP_VERSION=${{ needs.resolve.outputs.tag }}

      - name: Build frpc for testing
        uses: docker/build-push-action@v6
        with:
          context: client
          load: true
          tags: frpc:test
          build-args: FRP_VERSION=${{ needs.resolve.outputs.tag }}

      - name: Smoke test
        env:
          FRPS_IMAGE: frps:test
          FRPC_IMAGE: frpc:test
        run: hack/smoke-test.sh

      - name: Build and push frps
        uses: docker/build-push-action@v6
        with:
          context: server
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-frps.outputs.tags }}
          labels: ${{ steps.meta-frps.outputs.labels }}
          annotations: ${{ steps.meta-frps.outputs.annotations }}
          build-args: FRP_VERSION=${{ needs.resolve.outputs.tag }}
          provenance: mode=max
          sbom: true

      - name: Build and push frpc
        uses: docker/build-push-action@v6
        with:
          context: client
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta-frpc.outputs.tags }}
          labels: ${{ steps.meta-frpc.outputs.labels }}
          annotations: ${{ steps.meta-frpc.outputs.annotations }}
          build-args: FRP_VERSION=${{ needs.resolve.outputs.tag }}
          provenance: mode=max
          sbom: true

      - name: Verify the published manifests
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          IMAGES: ${{ needs.resolve.outputs.frps_image }} ${{ needs.resolve.outputs.frpc_image }}
          TAGS: |
            ${{ steps.meta-frps.outputs.tags }}
            ${{ steps.meta-frpc.outputs.tags }}
        run: |
          set -euo pipefail

          for image in ${IMAGES}; do
            # Attestation manifests carry a platform of unknown/unknown and are
            # not architectures anyone can pull, so they are filtered out.
            published="$(docker buildx imagetools inspect "${image}:${VERSION}" --raw \
              | jq -r '.manifests[].platform
                       | select(.os != "unknown")
                       | .os + "/" + .architecture + (if .variant then "/" + .variant else "" end)')"

            for platform in ${PLATFORMS//,/ }; do
              if ! grep -qx -- "${platform}" <<<"${published}"; then
                echo "::error::${image}:${VERSION} is missing ${platform}"
                echo "published platforms: $(tr '\n' ' ' <<<"${published}")"
                exit 1
              fi
            done
            echo "${image}:${VERSION} covers ${PLATFORMS}"
          done

          {
            echo "## Published frp ${VERSION}"
            echo
            echo "Architectures: \`${PLATFORMS}\`"
            echo
            while read -r tag; do
              [ -n "${tag}" ] && echo "- \`${tag}\`"
            done <<<"${TAGS}"
          } >>"${GITHUB_STEP_SUMMARY}"
